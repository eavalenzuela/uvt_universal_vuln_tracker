name: Repository Hygiene

on:
  pull_request:
  push:

jobs:
  no-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tracked cache/build artifacts
        run: ./scripts/check-no-artifacts.sh

  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run backend tests
        run: pytest --cov=backend --cov-report=term-missing
        env:
          FLASK_ENV: testing
          ALLOW_PUBLIC_REGISTRATION: "true"

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Run dependency vulnerability scan
        # Audit the project's declared dependencies (and their transitive deps)
        # rather than the whole runner environment, so the result reflects what
        # we actually ship — not the runner's ambient pip/setuptools.
        run: pip-audit -r requirements.txt

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run frontend smoke tests
        run: node --test frontend/tests/**/*.test.js
