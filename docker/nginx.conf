server {
    listen 5173;
    # Also listen on IPv6. "localhost" resolves to ::1 inside the container, so
    # an IPv4-only socket made the Docker healthcheck's
    # `wget http://localhost:5173/` fail forever — the frontend reported
    # unhealthy while serving every real request fine.
    listen [::]:5173;
    root /usr/share/nginx/html;
    index index.html;

    # Scanner exports (.nessus, Qualys CSV, Trivy JSON) and SBOMs run to tens of
    # megabytes. nginx defaults to 1m, which rejected them with an HTML 413 the
    # JSON-expecting frontend could not parse. Keep in step with
    # MAX_CONTENT_LENGTH_MB in backend/config.py.
    client_max_body_size 64m;

    server_tokens off;

    # Security headers belong on the HTML document — that is what loads and
    # executes JavaScript and holds the session. The Flask app only ever serves
    # /api/*, so headers set there landed exclusively on JSON responses, where
    # a CSP restricts nothing.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;

    # Scoped to what the SPA actually loads: same-origin ES modules and
    # stylesheets, inline styles (views assign element.style directly), data:
    # images for the branding logo, and same-origin XHR/SSE. No 'unsafe-inline'
    # for scripts and no 'unsafe-eval'.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Server-Sent Events. Buffering would hold events until the buffer filled,
    # and the default 60s read timeout would drop an idle stream, so both are
    # disabled for this location specifically.
    location = /api/notifications/stream {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        chunked_transfer_encoding off;
    }

    location /api/ {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;

        # The API sets its own CSP for JSON; don't let the document policy
        # above leak onto API responses via inheritance.
        proxy_hide_header Content-Security-Policy;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
    }
}
