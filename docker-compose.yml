services:
  backend:
    build:
      context: .
      target: backend
    # The backend is reached through the nginx frontend service. Publishing
    # 5000 on the host also exposes /metrics — which reports vulnerability
    # counts and user activity — outside the compose network. Uncomment only
    # if you need to reach the API directly.
    # ports:
    #   - "5000:5000"
    expose:
      - "5000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-uvt_user}:${POSTGRES_PASSWORD:-uvt_pass}@postgres:5432/${POSTGRES_DB:-uvt}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      RATE_LIMIT_BACKEND: ${RATE_LIMIT_BACKEND:-redis}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/2}
      CELERY_ENABLED: ${CELERY_ENABLED:-true}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      # Secure cookies are the default. Session cookies would otherwise be
      # sent in cleartext, and this flag also gates the HSTS header. Override
      # to false only for local HTTP development.
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/health')"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: .
      target: frontend
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://localhost:5173/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-uvt_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-uvt_pass}
      POSTGRES_DB: ${POSTGRES_DB:-uvt}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-uvt_user} -d ${POSTGRES_DB:-uvt}"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  celery-worker:
    build:
      context: .
      target: backend
    command: celery -A backend.celery_app:celery worker --loglevel=info --concurrency=${CELERY_WORKER_CONCURRENCY:-4}
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-uvt_user}:${POSTGRES_PASSWORD:-uvt_pass}@postgres:5432/${POSTGRES_DB:-uvt}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/2}
      CELERY_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # The image's HEALTHCHECK polls http://localhost:5000/api/health, which
      # these containers do not serve — they run Celery, not Gunicorn — so both
      # reported "unhealthy" permanently while working fine. Ask Celery instead.
      test: ["CMD-SHELL", "celery -A backend.celery_app:celery inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    restart: unless-stopped

  celery-beat:
    build:
      context: .
      target: backend
    command: celery -A backend.celery_app:celery beat --loglevel=info --schedule /tmp/celerybeat-schedule
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-uvt_user}:${POSTGRES_PASSWORD:-uvt_pass}@postgres:5432/${POSTGRES_DB:-uvt}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/2}
      CELERY_ENABLED: "true"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      # Beat has no inspect endpoint, and the slim image ships neither pgrep
      # nor ps, so check the thing beat actually depends on: the broker.
      test: ["CMD-SHELL", "python -c \"from backend.celery_app import celery; celery.broker_connection().ensure_connection(max_retries=1)\" || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
